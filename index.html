<style>
/* Layout: a two-channel bench instrument. Blue trace = signals in, orange trace = what comes out (and XP). Labs are the screen; controls sit in a side rack. */
:root{
  --bg:#edf0f6; --panel:#ffffff; --panel2:#e3e8f2; --line:#c6cfdf; --grid:#e6eaf2;
  --fg:#141a2c; --muted:#59637e;
  --ch1:#2457d6; --ch2:#dd6214; --ch3:#0c8f6f;
  --good:#16834f; --bad:#c3303d; --goodbg:#e2f4ea; --badbg:#fbe7e9;
  --f-display:"Red Hat Display", "Avenir Next", system-ui, sans-serif;
  --f-body:"Red Hat Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1120; --panel:#141b2d; --panel2:#1b2440; --line:#2b3757; --grid:#1d2640;
  --fg:#e9edf7; --muted:#97a2c0;
  --ch1:#6e9cff; --ch2:#ff9d52; --ch3:#3fd0a6;
  --good:#52d690; --bad:#ff6d79; --goodbg:#12301f; --badbg:#3a1820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1120; --panel:#141b2d; --panel2:#1b2440; --line:#2b3757; --grid:#1d2640;
  --fg:#e9edf7; --muted:#97a2c0;
  --ch1:#6e9cff; --ch2:#ff9d52; --ch3:#3fd0a6;
  --good:#52d690; --bad:#ff6d79; --goodbg:#12301f; --badbg:#3a1820; color-scheme:dark}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:clamp(22px,3vw,28px);font-weight:900;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
p{margin:0}
.m{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ch1);outline-offset:2px}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--fg)}
.brand svg{flex:none}
.brand b{font:900 22px/1 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.06em;margin-top:3px}
.meter{display:flex;align-items:center;gap:10px;min-width:0}
.lvl{font:700 13px var(--f-mono);background:var(--fg);color:var(--bg);border-radius:6px;padding:4px 8px;white-space:nowrap}
.xpbar{width:min(220px,40vw);height:10px;border-radius:5px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:var(--ch2);transition:width .5s}
.xptxt{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{font:500 12px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--fg)}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:24px}
nav.tabs a{color:var(--muted);text-decoration:none;font-weight:600;padding:10px 14px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--ch2)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-bottom:28px}
.hero .card{padding:22px}
.hero h2{font-size:clamp(26px,4vw,38px);line-height:1.08}

.next{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--ch1)}
.btn.primary{background:var(--ch1);border-color:var(--ch1);color:#fff}
.btn.hot{background:var(--ch2);border-color:var(--ch2);color:#1c0c00}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:14px}
.grid-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:10px;padding:16px;text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--ch1);transform:translateY(-1px)}
.tcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard .src{font:12px var(--f-mono);color:var(--muted)}
.tcard canvas{width:100%;height:46px;display:block}
.prog{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ch1)}
.prog.done i{background:var(--good)}
.flag{font:600 11px var(--f-mono);border-radius:999px;padding:2px 8px;white-space:nowrap}
.flag.weak{background:var(--ch2);color:#1c0c00}
.flag.card{background:var(--goodbg);color:var(--good);border:0}
.flag.new{background:var(--panel2);color:var(--muted)}
.section{margin-top:34px}
.section>.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bossrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.boss{padding:16px;display:flex;flex-direction:column;gap:8px}
.boss.locked{opacity:.65}
.boss .hp{display:flex;gap:3px}
.boss .hp i{flex:1;height:6px;border-radius:2px;background:var(--bad)}
.boss.won .hp i{background:var(--good)}

/* lab */
.labhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.labhead p{color:var(--muted);max-width:70ch;margin-top:6px}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.screen{display:flex;flex-direction:column;gap:12px;min-width:0}

.key{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-weight:500}

.rack{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}

.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:14px}

.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ch1)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ch1);border-color:var(--ch1);color:#fff}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:14px var(--f-body);width:100%}
.readout{font:13px/1.6 var(--f-mono);color:var(--muted);background:var(--panel2);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}

.verdict{font:600 13px var(--f-mono);border-radius:8px;padding:8px 10px}

.chals{display:flex;flex-direction:column;gap:8px}
.chal{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;font-size:14px;line-height:1.4}

.chal.done .box{background:var(--good);border-color:var(--good)}
.chal.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

.minigame{display:flex;flex-direction:column;gap:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}

/* toasts / modal */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:pop .3s ease-out}
.toast .x{color:var(--ch2);font-family:var(--f-mono)}

.modal .card{padding:28px;max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal .big{font-size:64px}
@media (max-width:900px){.lab{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}}

<script type="text/plain" id="guide-md">
## 1. Systems: linearity & time invariance (Systems lec + rec, Oct 8)
- **Additive:** x1+x2 → y1+y2. **Homogeneous:** αx → αy. **Linear** = both (superposition, for all α, β, all inputs).
- **Time-invariant:** x[n−n0] → y[n−n0] for all n0. Replace *every* n when shifting.
- One counterexample proves "No"; "Yes" needs algebra for all inputs.
- **Quick heuristics:**
  - Zero in must give zero out for linear (y = x+1 fails).
  - Gain depending on n or t (n·x[n], t·x(t), (−1)ⁿx[n]) → can be linear, NOT TI.
  - Nonlinear function of x alone (sin x, |x|, x[n]x[n−1]) → TI, NOT linear.
  - Convolution with fixed h (incl. integrator ∫ from −∞ to t, h=u) → LTI.
  - Time reversal x[−n], compression x[2n] → linear, NOT TI.
  - ∫ from 0 to t → linear, NOT TI (fixed lower limit). ∫ from −∞ to t, ∫ from t to ∞, ∫ over all t, d/dt → LTI.
- Constant-coefficient linear difference/differential equations → LTI.
- Cascade of two time-varying systems CAN be TI (×(−1)ⁿ → LPF → ×(−1)ⁿ is an LTI highpass).
- Three LTI representations: difference/differential eq., unit-sample/impulse response (convolution), frequency response (filter).
## 2. Unit-sample response & convolution (lec + Superposition rec, Oct 15)
- x[n] = Σ x[m]δ[n−m] ⇒ for LTI, y[n] = Σ x[m]h[n−m] = (x∗h)[n]. CT: y(t) = ∫x(τ)h(t−τ)dτ.
- h fully characterizes an LTI system.
- **Compute:** superposition (sum scaled/shifted h's) or flip-and-shift (flip h, shift by n, multiply, sum). Same answer.
- **Properties:** commutative, associative (cascade order doesn't matter, h_total = h1∗h2), distributive (parallel → h1+h2).
- **Length:** len(x∗h) = len(x)+len(h)−1. Example [1,1,1]∗[1,1,1] = [1,2,3,2,1].
- **Limits come from step functions:** u[m]u[n−m] ⇒ 0 ≤ m ≤ n.
- **Convolution with u = running sum (accumulator).** Undo with first difference.
  - (0.9)ⁿu ∗ u = (1−0.9ⁿ⁺¹)/(1−0.9) = 10 − 9(0.9)ⁿ (n+1 terms!).
  - u∗u = (n+1)u[n]; u∗u∗u = (n+1)(n+2)/2 · u[n].
  - aⁿu ∗ aⁿu = (n+1)aⁿu[n].
- Don't drop the u[n]: results are causal.
- Unit step has no DTFT (sum doesn't converge) → use the time domain for step cascades.
- **Solera (rec):** 1-barrel h1[n] = (½)ⁿu[n−1]; h2 = h1∗h1 = (n−1)(½)ⁿu[n−2]; h3 = (n−1)(n−2)/2 · (½)ⁿu[n−3].
- **CT examples (rec):** f = e^{−t}u(t), g = e^{t}u(−t) = f(−t): f∗f = t e^{−t}u(t); g∗g = (f∗f)(−t); f∗g = g∗f = ½e^{−|t|}.
- Rect ∗ rect = trapezoid; equal widths → triangle.
- Application: optical blur = convolution with a point-spread function (microscope, Hubble).
## 3. Frequency response & filtering (Oct 20)
- e^{jΩn} → H(Ω)e^{jΩn}: complex exponentials are eigenfunctions. H(Ω) = Σ h[n]e^{−jΩn} = DTFT of h.
- **Convolution in time ⇔ multiplication in frequency:** Y = H·X.
- **Three ways to get H from y[n] − αy[n−1] = x[n]:** find h = αⁿu[n] then DTFT; plug in x = e^{jΩn}; or DTFT the equation (delay ⇒ ×e^{−jΩ}). Result H(Ω) = 1/(1 − αe^{−jΩ}), lowpass for 0 < α < 1.
- CT: y + α dy/dt = 2x ⇒ H(ω) = 2/(1 + jωα) (d/dt ⇒ ×jω).
- **Quick checks:** H(0) = Σh[n]; H(π) = Σh[n](−1)ⁿ; 2π-periodic; a d-sample delay gives phase slope −d.
  - h = δ[n] − δ[n−2] ⇒ G = j2 sinΩ e^{−jΩ}; |G| = 2|sinΩ|, zeros at 0 and π.
  - 1 + e^{−jaΩ} = e^{−jaΩ/2}·2cos(aΩ/2); 1 − e^{−jaΩ} = e^{−jaΩ/2}·2j sin(aΩ/2).
- **Ideal LPF** (cutoff Ωc): h[n] = sin(Ωc n)/(πn).
- **Frequency shift:** e^{jΩ0 n}x[n] ⇔ X(Ω−Ω0). (−1)ⁿh_L[n] has H_L(Ω−π): a highpass.
## 4. Communication systems (Oct 22)
- Antenna ~ wavelength: λ = c/f. Speech (200–3000 Hz) needs 100–1500 km antennas, so modulate up.
- **Multiplication in time ⇔ convolution in frequency:** x·y ⇔ (1/2π)(X∗Y).
- cos(ωc t) ⇔ π[δ(ω−ωc) + δ(ω+ωc)].
- **AM (DSB):** x(t)cos(ωc t) ⇔ ½[X(ω−ωc) + X(ω+ωc)].
- **Synchronous demod:** multiply by cos(ωc t) again, then LPF (gain 2) recovers x.
- **Phase error φ:** output ∝ x·cosφ → fading; φ = π/2 gives nothing.
- **AM with carrier:** (x+C)cos ωc t; envelope detection works when x + C ≥ 0. Costs lots of carrier power.
- **FDM:** non-overlapping carriers; tune by choosing the demod frequency.
- **SSB (rec):** quadrature cos/sin branches send one sideband: half the bandwidth.
- **Bandpass from LPF (rec):** h_LPF[n]cos(Ωc n) is bandpass. The two-branch (cos and sin) version is equivalent; a single cos branch is not.
## 5. CT Fourier facts from the review
- Pulse p_S(t) (height 1, |t| < S) ⇔ 2 sin(Sω)/ω. F(0) = area. Zeros spaced π/S.
- f = p3 − p2 ⇒ F = 2sin3ω/ω − 2sin2ω/ω.
- f(t/2) ⇔ 2F(2ω); f(2t) ⇔ ½F(ω/2); f∗f ⇔ F²; f(t−1) ⇔ e^{−jω}F(ω); t f(t) ⇔ j dF/dω; f e^{j2πt} ⇔ F(ω−2π).
- f cos2πt ⇔ ½[F(ω−2π)+F(ω+2π)] (small center bump); f sin2πt ⇔ (1/2j)[F(ω−2π)−F(ω+2π)] (larger center bump).
## 6. Filtering periodic signals (review P4)
- Fo[k] = H[k]·Fi[k]: an LTI system can't create a harmonic the input lacks.
- Possible only if Zeros(Fi) ⊆ Zeros(Fo). Where Fi = 0, H is unconstrained.
## 7. DFT (Oct 27/29)
- **6.300 convention:** X[k] = (1/N)Σ x[n]e^{−j2πkn/N}; x[n] = Σ X[k]e^{j2πkn/N}.
- **Two views:** DTFS of the periodic extension; or (1/N)·samples of the DTFT of the windowed signal at Ω = 2πk/N.
- Real cosine at bin k0 → peaks at k0 and N−k0. Not periodic in N → leakage.
- Rectangular window: W(Ω) = sin(NΩ/2)/sin(Ω/2) · e^{−jΩ(N−1)/2}; main lobe 4π/N wide.
- **f = k·fs/N**; bin spacing fs/N; peak error up to half a bin.
- **Resolution:** two tones resolve if ΔΩ > 2π/N.
- **Circular convolution:** Fa[k]Fb[k] ⇔ (1/N)(fa ⊛ fb)[n]. Do the normal convolution, then wrap the tail back mod N. Need N ≥ len(fa)+len(fb)−1 to avoid aliasing.
- Impulse trains transform to impulse trains: period L in time ↔ period N/L in frequency.
## 8. STFT, spectrograms, windows (Nov 3)
- STFT: X[k,m] = (1/N)Σ x[n+ms]w[n]e^{−j2πkn/N}; spectrogram = |X[k,m]|².
- **Choose N:** N/fs ≤ window duration; fs/N ≤ bin width. Example: 4410 < N < 5512.
- **Zero-padding** samples the DTFT more finely but does NOT improve resolution.
- Windows: rectangular (narrowest main lobe, highest sidelobes); triangular = rect∗rect; Hann (lowest sidelobes).
- **Overlap-add:** fill each block with s < N samples, zero-pad; need len(h) ≤ N−s+1; add the overlapping outputs.
## 9. Speech (Nov 5)
- **Source/filter:** glottal pulses (100–300 Hz) or noise → vocal tract filter H → speech.
- Pitch = harmonic spacing; formants = resonances (F1, F2, F3) that shape the envelope.
- Change Np → pitch changes; change H → vowel changes; noise source → whisper.

const TG=(()=>{const a=[];for(let t=-12;t<=12+1e-9;t+=.02)a.push(+t.toFixed(4));return a})();
const WG=(()=>{const a=[];for(let i=0;i<=480;i++)a.push(-4*PI+8*PI*i/480);return a})();
function buildSig(o){const S0=o.S??1,t0=o.t0||0,wm=o.wm??TAU;const re=new Float64Array(TG.length),im=new Float64Array(TG.length);

function ctft(sig){const dt=.02,out=[];for(const w of WG){const c=Math.cos(w*dt),s=Math.sin(w*dt);let cr=Math.cos(w*TG[0]),ci=-Math.sin(w*TG[0]);let R=0,I=0;for(let i=0;i<TG.length;i++){const a=sig.re[i],b=sig.im[i];if(a||b){R+=a*cr-b*ci;I+=a*ci+b*cr}const nr=cr*c+ci*s;ci=ci*c-cr*s;cr=nr}out.push([R*dt,I*dt])}return out}
const MOPS=[
 {id:'s2',label:'f(t/2)',o:{S:2},why:'Wider pulse → narrower main lobe (first zero at π/2) and twice the height: 2F(2ω).'},
 {id:'c2',label:'f(2t)',o:{S:.5},why:'Narrower pulse → wider sinc (first zero at 2π), half the height: ½F(ω/2).'},

const AMFS=50,AMN=2000,AMT=Array.from({length:AMN},(_,i)=>i/AMFS);

function lpfTaps(wc){const L=151,dt=1/AMFS,h=[];for(let k=0;k<L;k++){const tau=(k-75)*dt;const s=Math.abs(tau)<1e-12?wc/PI:Math.sin(wc*tau)/(PI*tau);h.push(s*dt*(0.5-0.5*Math.cos(TAU*k/(L-1))))}return h}

function corr(a,b,i0,i1){let ab=0,aa=0,bb=0;for(let i=i0;i<i1;i++){ab+=a[i]*b[i];aa+=a[i]*a[i];bb+=b[i]*b[i]}return{c:ab/Math.sqrt(aa*bb+1e-12),ra:Math.sqrt(aa/(i1-i0)),rb:Math.sqrt(bb/(i1-i0))}}

function genQ(topic){return pick(D[topic])()}

/* question renderer shared by drills and bosses */
function renderQ(host,q,onDone,meta){
  host.innerHTML=`<div class="qtop"><span class="eyebrow">${TMAP[q.topic].name}</span><span>${meta||''}</span></div><div class="qtext">${q.q}</div>${q.plot?'<div class="plotbox" style="margin-bottom:12px"><canvas id="q-plot" data-h="160"></canvas></div>':''}
   ${q.type==='mc'?`<div class="opts" id="q-opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`:`<div class="tin"><input id="q-in" inputmode="decimal" aria-label="Your answer" placeholder="answer (fractions like 3/2 work)"><button class="btn primary" id="q-go">Submit</button></div>`}<div id="q-fb"></div>`;
  if(q.plot)q.plot($('#q-plot'));
  let done=false;
  const finish=(ok,shown)=>{if(done)return;done=true;$('#q-fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not quite. '+(shown?`Answer: ${shown}`:'')}</b>${q.why||''}</div>`;onDone(ok)};
  if(q.type==='mc'){$('#q-opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||done)return;const i=+b.dataset.i,ok=i===q.ans;$$('.opt',host).forEach(x=>{x.disabled=true;if(+x.dataset.i===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});finish(ok)}}
  else{const go=()=>{const u=parseNum($('#q-in').value);if(u===null)return;const a=q.ans;const ok=q.tol?Math.abs(u-a)<=Math.max(q.tol*Math.abs(a),1e-6):Math.abs(u-a)<1e-6;$('#q-in').disabled=true;finish(ok,fmt(a))};$('#q-go').onclick=go;$('#q-in').addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>$('#q-in')&&$('#q-in').focus(),50)}
}

let drillState={topic:'all',combo:0,count:0,right:0};
function pickDrillTopic(){const t=drillState.topic;if(t==='all')return pick(TOPICS).id;if(t==='weak'){const w=TOPICS.filter(x=>isWeak(x.id)||T(x.id).att===0).map(x=>x.id);return w.length?pick(w):pick(TOPICS).id}return t}
function viewDrills(el,topic){
  if(topic&&TMAP[topic])drillState.topic=topic;
  el.innerHTML=`<div class="labhead"><div><div class="eyebrow">Drills</div><h2>Fresh problems every time</h2><p>Each correct answer is worth 10 XP. Weak topics (under 70% after 3 tries) pay 15. Three in a row starts a combo bonus.</p></div></div>
   <div class="drillbar" id="dbar"><button data-t="all">All topics</button><button data-t="weak">Weak spots</button>${TOPICS.map(t=>`<button data-t="${t.id}">${t.name}</button>`).join('')}</div>
   <div class="card qcard" id="qhost"></div><div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn hot" id="qnext">Next problem</button><span class="combo" id="combo"></span><span class="muted" id="dstat" style="font-size:14px"></span></div>`;
  const bar=$('#dbar');const sync=()=>$$('button',bar).forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===drillState.topic));sync();
  bar.onclick=e=>{const b=e.target.closest('button');if(!b)return;drillState.topic=b.dataset.t;sync();next()};
  const next=()=>{const tp=pickDrillTopic();const q=genQ(tp);const weak=isWeak(tp);
   renderQ($('#qhost'),q,ok=>{const t=T(tp);t.att++;drillState.count++;if(ok){t.ok++;drillState.right++;drillState.combo++;const bonus=drillState.combo>=3?5:0;award((weak?15:10)+bonus,tp,bonus?`Combo ×${drillState.combo}`:'')}else drillState.combo=0;save();stat()},weak?'<span class="flag weak">Weak spot · 15 XP</span>':'<span class="flag new">10 XP</span>')};
  const stat=()=>{$('#combo').textContent=drillState.combo>=2?`Combo ${drillState.combo}`:'';$('#dstat').textContent=drillState.count?`This session: ${drillState.right}/${drillState.count}`:''};
  $('#qnext').onclick=next; next(); stat();
}

const REVIEW_SYS=[{tex:'y[n] = (−½)ⁿ(x[n] + 1)',L:0,T:0,why:'x = 0 gives (−½)ⁿ: not linear. n-dependent gain: not TI.'},{tex:'y[n] = sin(x[n])',L:0,T:1,why:'Nonlinear function of x alone: TI, not linear.'},{tex:'y(t) = ∫_{−∞}ᵗ x(τ)dτ',L:1,T:1,why:'Convolution with u(t): LTI.'},{tex:'y(t) = t·x(t)',L:1,T:0,why:'Gain depends on t: linear, not TI.'}];
function harmGate(){const all=[1,2,3,4,5,6];const sub=()=>all.filter(()=>Math.random()<.35);const zi=sub();let zo;if(Math.random()<.5){zo=[...new Set([...zi,...sub()])].sort((a,b)=>a-b)}else{zo=sub();if(zi.every(k=>zo.includes(k))&&zi.length)zo=zo.filter(k=>k!==zi[0])}
 const ok=zi.every(k=>zo.includes(k));const f=a=>a.length?'±'+a.join(', ±'):'none';
 return mc('dft',`Input fᵢ has zero Fourier coefficients at k = <span class="m">${f(zi)}</span>. Output fₒ has zeros at k = <span class="m">${f(zo)}</span>. Could an LTI system produce fₒ from fᵢ?`,ok?'Yes':'No',[ok?'No':'Yes'],'Fₒ[k] = H[k]·Fᵢ[k]: an LTI system can\'t create a harmonic the input lacks, so you need Zeros(Fᵢ) ⊆ Zeros(Fₒ).')}

let bossRun=null;
function viewBosses(el){
  el.innerHTML=`<div class="labhead"><div><div class="eyebrow">Boss fights</div><h2>Quiz-style gauntlets</h2><p>Eight problems modeled on the Spring 2025 quiz. 7 minutes, 3 lives. First win is worth 150 XP; rematches 40. Bosses unlock as your total XP grows.</p></div></div><div class="bossrow">${BOSSES.map(b=>{const lock=S.xp<b.need,won=S.boss[b.id];return `<div class="card boss${lock?' locked':''}${won?' won':''}"><div class="eyebrow">${won?'Defeated':lock?`Unlocks at ${b.need} XP`:'Ready'}</div><h3>${b.name}</h3><p class="muted" style="font-size:14px">${b.sub}</p><div class="hp">${'<i></i>'.repeat(8)}</div><button class="btn ${lock?'':'hot'}" data-b="${b.id}" ${lock?'disabled':''}>${won?'Rematch':'Fight'}</button></div>`}).join('')}</div><div id="bossarena" class="section"></div>`;
  $$('[data-b]',el).forEach(b=>b.onclick=()=>startBoss(b.dataset.b));
}
function startBoss(id){const b=BOSSES.find(x=>x.id===id);bossRun={b,qs:b.gen(),i:0,lives:3,hits:0,end:Date.now()+7*60*1000,over:false};
 const a=$('#bossarena');a.innerHTML=`<div class="bossui"><h3>${b.name}</h3><div class="bosshp"><i id="bhp" style="width:100%"></i></div><span class="lives" id="blives"></span><span class="timer" id="btimer"></span></div><div class="card qcard" id="bq"></div><div style="margin-top:12px"><button class="btn hot" id="bnext" hidden>Next</button></div>`;
 a.scrollIntoView({behavior:'smooth',block:'start'});
 clearInterval(bossRun.tick);bossRun.tick=setInterval(bossTick,500);bossTick();bossQ()}
function bossTick(){const r=bossRun;if(!r||r.over)return;const ms=r.end-Date.now();const el=$('#btimer');if(!el){clearInterval(r.tick);return}if(ms<=0){bossEnd(false,'Time ran out.');return}el.textContent=`${Math.floor(ms/60000)}:${String(Math.floor(ms%60000/1000)).padStart(2,'0')}`;$('#blives').textContent='♥'.repeat(r.lives)+'♡'.repeat(3-r.lives)}
function bossQ(){const r=bossRun;const q=r.qs[r.i];$('#bnext').hidden=true;renderQ($('#bq'),q,ok=>{const t=T(q.topic);t.att++;if(ok){t.ok++;r.hits++}else r.lives--;save();
  $('#bhp').style.width=(100-r.hits/r.qs.length*100)+'%';bossTick();
  if(r.lives<=0){setTimeout(()=>bossEnd(false,'Out of lives.'),900);return}
  r.i++;if(r.i>=r.qs.length){setTimeout(()=>bossEnd(true),900);return}
  const n=$('#bnext');n.hidden=false;n.onclick=bossQ},`Problem ${r.i+1} of ${r.qs.length}`)}
function bossEnd(win,why){const r=bossRun;if(!r||r.over)return;r.over=true;clearInterval(r.tick);const first=win&&!S.boss[r.b.id];
 if(win){S.boss[r.b.id]=true;save()}
 $('#bossarena').innerHTML=`<div class="card qcard" style="text-align:center"><div class="eyebrow">${win?'Victory':'Defeat'}</div><h2 style="margin:8px 0">${win?`${r.b.name} defeated`:why}</h2><p class="muted">${r.hits} of ${r.qs.length} correct.${win?'':' Drill the topics it covers, then try again.'}</p><div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn hot" id="bre">${win?'Rematch':'Try again'}</button><a class="btn" href="#drills">Go to drills</a></div></div>`;
 $('#bre').onclick=()=>{viewBosses($('#view'));startBoss(r.b.id)};
 if(win)award(first?150:40,null,first?'Boss defeated':'Rematch won');}

/* ============ note sheet ============ */
const CARDS={
 lti:['Linear = additive + homogeneous. TI: x[n−n₀] → y[n−n₀] (replace every n).','One counterexample proves "No". Zero in must give zero out.','n- or t-dependent gain → maybe linear, not TI. f(x) alone (sin, |x|, x²) → TI, not linear.','x[−n], x[2n], ∫₀ᵗ → linear, not TI. ∫_{−∞}ᵗ, d/dt, convolution → LTI.','×(−1)ⁿ → LPF → ×(−1)ⁿ is LTI (a highpass).'],
 conv:['y[n] = Σ x[k]h[n−k]; y(t) = ∫x(τ)h(t−τ)dτ.','len(x∗h) = len(x) + len(h) − 1.','∗u = running sum: aⁿu∗u = (1 − aⁿ⁺¹)/(1 − a). n+1 terms!','u∗u = (n+1)u; u∗u∗u = (n+1)(n+2)/2·u; aⁿu∗aⁿu = (n+1)aⁿu.','e^{−t}u ∗ e^{−t}u = te^{−t}u; e^{−t}u ∗ eᵗu(−t) = ½e^{−|t|}.','Commutative, associative (cascades), distributive (parallel).'],
 freq:['e^{jΩn} → H(Ω)e^{jΩn}; H = DTFT{h}; Y = HX.','H(0) = Σh[n]; H(π) = Σh[n](−1)ⁿ; delay d → phase slope −d.','y − αy[n−1] = x → H = 1/(1 − αe^{−jΩ}). CT: d/dt → jω.','1 ± e^{−jaΩ} = e^{−jaΩ/2}·{2cos(aΩ/2), 2j sin(aΩ/2)}.','Ideal LPF: h = sin(Ω_c n)/(πn). (−1)ⁿh ⇔ H(Ω − π).'],
 four:['p_S ⇔ 2 sin(Sω)/ω; zeros every π/S; F(0) = area.','f(at) ⇔ (1/|a|)F(ω/a); f(t − t₀) ⇔ e^{−jωt₀}F (|F| same).','f∗f ⇔ F²; t f ⇔ j dF/dω (zero at ω = 0).','f e^{jω₀t} ⇔ F(ω − ω₀); f cos ω₀t ⇔ ½[F(ω−ω₀) + F(ω+ω₀)].','f sin ω₀t ⇔ (1/2j)[F(ω−ω₀) − F(ω+ω₀)].'],
 am:['λ = c/f. x·y ⇔ (1/2π)X∗Y. cos ω_c t ⇔ π[δ(ω−ω_c) + δ(ω+ω_c)].','AM: x cos ω_c t ⇔ ½[X(ω−ω_c) + X(ω+ω_c)].','Sync demod: ×cos again, LPF gain 2. Phase error → ×cos φ (φ = π/2 → nothing).','With carrier: (x + C)cos ω_c t; envelope works iff x + C ≥ 0.','SSB = half bandwidth. BPF from LPF needs cos AND sin branches.'],
 dft:['X[k] = (1/N)Σ x[n]e^{−j2πkn/N}; x[n] = Σ X[k]e^{j2πkn/N}.','= DTFS of periodic extension = (1/N)·DTFT of windowed x at 2πk/N.','f = k f_s/N. Resolve if ΔΩ > 2π/N. Rect main lobe 4π/N.','Cosine at k₀ → bins k₀ and N − k₀. Non-integer k₀ → leakage.','F_aF_b ⇔ (1/N) circular conv: wrap mod N. No alias if N ≥ L_a + L_b − 1.','Zeros(Fᵢ) ⊆ Zeros(Fₒ) for LTI (H can\'t create harmonics).'],
 stft:['X[k,m] = (1/N)Σ x[n + ms]w[n]e^{−j2πkn/N}; spectrogram |X|².','Bin width f_s/N; frame N/f_s. Error ≤ e Hz → N ≥ f_s/(2e).','Zero-padding doesn\'t improve resolution (main lobe ~1/N_data).','Rect: narrow lobe, high sidelobes. Tri = rect∗rect. Hann: lowest sidelobes.','Overlap-add: s < N samples per block; len(h) ≤ N − s + 1.'],
 speech:['Source (pulses at f₀ or noise) → vocal tract H → speech.','Harmonic spacing = f₀ = pitch. Formants F1, F2, F3 = resonances = vowel.','Change N_p → pitch. Change H → vowel. Noise source → whisper.','High pitch → sparse harmonics → vowels blur.'],
};
function viewSheet(el){
  const n=TOPICS.filter(t=>S.cards[t.id]).length;
  el.innerHTML=`<div class="labhead"><div><div class="eyebrow">Note sheet builder</div><h2>${n} of 8 cards earned</h2><p>You get two handwritten pages on the quiz. Each card unlocks once you earn ${CARD_XP} XP in its topic, and it's the condensed version of what to copy onto your sheet.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="copy" ${n?'':'disabled'}>Copy unlocked cards</button></div></div>
   <div class="sheet">${TOPICS.map(t=>{const on=S.cards[t.id],x=T(t.id).xp;return `<div class="card scard${on?'':' locked'}"><div class="eyebrow">${t.short}</div><h3>${t.name}</h3>${on?'':`<p class="lockmsg">Locked: ${Math.min(x,CARD_XP)}/${CARD_XP} XP. <a href="#lab-${t.id}">Open the lab</a> or <a href="#drills-${t.id}">drill it</a>.</p>`}<ul class="body">${CARDS[t.id].map(l=>`<li>${on?esc(l):esc(l).replace(/[^\s]/g,'▇').slice(0,60)}</li>`).join('')}</ul></div>`}).join('')}</div><textarea id="copybuf" aria-hidden="true" style="position:absolute;left:-9999px;top:0"></textarea>`;
  const b=$('#copy');if(b)b.onclick=()=>{const txt=TOPICS.filter(t=>S.cards[t.id]).map(t=>t.name.toUpperCase()+'\n'+CARDS[t.id].map(l=>'• '+l).join('\n')).join('\n\n');
   const fall=()=>{const ta=$('#copybuf');ta.value=txt;ta.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text to copy')}};
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Copied to clipboard')).catch(fall);else fall()};
}

/* ============ study guide ============ */
function viewGuide(el){const md=$('#guide-md').textContent.trim().split('\n');let h='<div class="guide"><div class="eyebrow">Study guide</div><h2>Everything on Quiz 2</h2><p class="muted">Compiled from every lecture and recitation in your project. Tue Nov 10, 2–4 PM, Walker 50-340. Two handwritten sheets, no calculator.</p>';
 let depth=0;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
 for(const line of md){const m=line.match(/^(\s*)- (.*)$/);if(line.startsWith('## ')){while(depth>0){h+='</ul>';depth--}h+=`<h3>${inl(line.slice(3))}</h3>`}else if(m){const d=Math.floor(m[1].length/2)+1;while(depth<d){h+='<ul>';depth++}while(depth>d){h+='</ul>';depth--}h+=`<li>${inl(m[2])}</li>`}else if(line.trim()){while(depth>0){h+='</ul>';depth--}h+=`<p>${inl(line)}</p>`}}
 while(depth>0){h+='</ul>';depth--}el.innerHTML=h+'</div>'}

/* ============ home ============ */
function topicSpark(cv,id){const p={lti:n=>[n,Math.sin(n*.9)*(n>0?1:.4)],conv:n=>[n,Math.max(0,3-Math.abs(n-6)/2)],freq:n=>[n,1/(1+.8*n/10)],four:n=>[n,Math.abs(Math.sin((n-10)*.6)/((n-10)*.6||1))],am:n=>[n,Math.cos(n*.25)*Math.cos(n*2)],dft:n=>[n,Math.abs(Math.sin((n-10)*.9)/((n-10)*.9||1))],stft:n=>[n,(n%5<3?1:.2)*Math.sin(n)],speech:n=>[n,1/(1+((n-5)/2)**2)+.6/(1+((n-14)/2)**2)]}[id];
 const pts=[];for(let n=0;n<=20;n++)pts.push(p(n));const ys=pts.map(q=>q[1]);const lo=Math.min(0,...ys),hi=Math.max(...ys);plot(cv,{h:46,xmin:-.5,xmax:20.5,ymin:lo-.1,ymax:hi+.15,padL:4,noX:1,s:[{type:'stem',p:pts,c:'--ch1',r:2,w:1.4}]})}
function viewHome(el){
  const lv=levelOf(S.xp),done=Object.keys(S.ch).length,total=Object.keys(CH).length;
  const order=TOPICS.slice().sort((a,b)=>(isWeak(b.id)-isWeak(a.id))||(T(a.id).xp-T(b.id).xp));const nx=order.find(t=>!S.cards[t.id])||order[0];
  el.innerHTML=`<div class="hero"><div class="card"><div class="eyebrow">6.300 Quiz 2 · Tue Nov 10, 2 PM · Walker</div><h2 style="margin:8px 0 10px">Play with every signal on the quiz until it's obvious.</h2><p class="muted" style="max-width:56ch">Eight hands-on labs with challenges, drills that never repeat, and four boss fights built from the review quiz. XP unlocks your note-sheet cards.</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><a class="btn primary" href="#lab-${nx.id}">Continue: ${nx.name}</a><a class="btn" href="#drills-weak">Drill weak spots</a></div></div>
   <div class="card next" style="padding:22px"><div class="eyebrow">Progress</div><div class="big">${S.xp}<span style="font-size:20px;color:var(--muted)"> XP</span></div><p>Level ${lv+1} · <b>${LEVELS[lv][1]}</b></p><p class="muted" style="font-size:14px">${done}/${total} challenges · ${TOPICS.filter(t=>S.cards[t.id]).length}/8 note cards · ${Object.keys(S.boss).length}/4 bosses</p></div></div>
   <div class="section"><div class="head"><div><div class="eyebrow">Labs</div><h2>Pick a bench</h2></div></div><div class="grid-topics">${TOPICS.map(t=>{const x=T(t.id),pct=Math.min(100,x.xp/CARD_XP*100),cn=Object.keys(CH).filter(k=>CH[k].t===t.id),cd=cn.filter(k=>S.ch[k]).length;const fl=S.cards[t.id]?'<span class="flag card">Card earned</span>':isWeak(t.id)?'<span class="flag weak">Weak spot</span>':x.att===0&&x.xp===0?'<span class="flag new">New</span>':'';
     return `<a class="card tcard" href="#lab-${t.id}"><div class="row"><span class="src">${t.lec}</span>${fl}</div><canvas data-spark="${t.id}"></canvas><div><h3>${t.name}</h3><p class="muted" style="font-size:14px">${t.short}</p></div><div class="row"><span class="src">${cd}/${cn.length} challenges</span><span class="src">${Math.min(x.xp,CARD_XP)}/${CARD_XP} XP</span></div><div class="prog${pct>=100?' done':''}"><i style="width:${pct}%"></i></div></a>`}).join('')}</div></div>
   <div class="section"><div class="head"><div><div class="eyebrow">Boss fights</div><h2>The quiz, four problems at a time</h2></div><a class="btn" href="#bosses">All bosses</a></div><div class="bossrow">${BOSSES.map(b=>`<div class="card boss${S.xp<b.need?' locked':''}${S.boss[b.id]?' won':''}"><div class="eyebrow">${S.boss[b.id]?'Defeated':S.xp<b.need?`Unlocks at ${b.need} XP`:'Ready'}</div><h3>${b.name}</h3><p class="muted" style="font-size:14px">${b.sub}</p></div>`).join('')}</div></div>`;
  $$('[data-spark]',el).forEach(c=>topicSpark(c,c.dataset.spark));
}
function viewLab(el,id){const t=TMAP[id];el.innerHTML=`<div class="labhead"><div><div class="eyebrow">${t.lec}</div><h2>${t.name}</h2><p>${LABINFO[id]}</p></div><a class="btn" href="#home">All labs</a></div><div id="labroot"></div>`;LABS[id].mount($('#labroot'))}

/* ============ router ============ */
let current=null;
function route(){
  if(SPEECH.on)SPEECH.stop();
  if(bossRun&&!bossRun.over){clearInterval(bossRun.tick);bossRun=null}
  const h=(location.hash||'#home').slice(1);const el=$('#view');
  let tab='home';
  if(h.startsWith('lab-')&&LABS[h.slice(4)]){viewLab(el,h.slice(4));current=()=>{const L=LABS[h.slice(4)];if(L.render)L.render();if(h==='lab-am'&&L.renderEnv)L.renderEnv();if(h==='lab-dft')L.renderCirc();if(h==='lab-stft')L.renderWin();if(h==='lab-speech')L.update()};tab='home'}
  else if(h.startsWith('drills')){viewDrills(el,h.split('-')[1]==='weak'?(drillState.topic='weak',null):h.split('-')[1]);current=null;tab='drills'}
  else if(h==='bosses'){viewBosses(el);current=null;tab='bosses'}
  else if(h==='sheet'){viewSheet(el);current=null;tab='sheet'}
  else if(h==='guide'){viewGuide(el);current=null;tab='guide'}
  else{viewHome(el);current=()=>$$('[data-spark]').forEach(c=>topicSpark(c,c.dataset.spark));tab='home'}
  $$('#tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+tab?'page':'false'));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>current&&current(),150)});
const mq=matchMedia('(prefers-color-scheme: dark)');(mq.addEventListener?mq.addEventListener('change',()=>current&&current()):mq.addListener(()=>current&&current()));
new MutationObserver(()=>current&&current()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
hud(); route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>current&&current());
</script>
